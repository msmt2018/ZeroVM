name: Schema contract tests

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "tests/schema/**"
      - "requirements-dev.txt"
      - ".github/workflows/schema-contracts.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "tests/schema/**"
      - "requirements-dev.txt"
      - ".github/workflows/schema-contracts.yml"

permissions:
  contents: read

jobs:
  schema-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate schema contracts and fixtures
        run: python -m unittest discover -s tests/schema -v
