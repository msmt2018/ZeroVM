name: Native and Android foundation
on:
  push:
    branches: [main, "feat/native-app-foundation"]
    paths:
      - "app/**"
      - "core/**"
      - "native/**"
      - "rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/native-app-foundation.yml"
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "native/**"
      - "rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/native-app-foundation.yml"
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S native -B build/native -DZEROVM_BUILD_TESTS=ON
      - name: Build native core
        run: cmake --build build/native --parallel 2
      - name: Run native ABI tests
        run: ctest --test-dir build/native --output-on-failure
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: cargo test --workspace --locked
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "platforms;android-37" "build-tools;36.0.0" \
            "ndk;30.0.16248370" "cmake;3.31.6"
      - name: Generate wrapper for CI
        run: gradle wrapper --gradle-version 9.6.0
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
